<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA ADMIN — Live Chats</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      overflow: hidden;
    }
    body {
      display: flex;
      height: 100dvh;
    }
    .chat-list {
      width: 100%;
      max-width: 320px;
      background: #000;
      color: #fff;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-right: 3px solid #C8FF00;
      flex-shrink: 0;
    }
    .chat-list h2 {
      padding: 16px;
      margin: 0;
      color: #C8FF00;
      font-size: 18px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: #000;
      z-index: 5;
    }
    .chat-list h2 .logo-badge {
      background: #C8FF00;
      color: #000;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .chat-item {
      padding: 14px 16px;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }
    .chat-item:hover, .chat-item.active {
      background: #1a1a1a;
    }
    .chat-item .title { font-weight: bold; color: #C8FF00; }
    .chat-item .sub { font-size: 12px; color: #aaa; margin-top: 4px; }
    .chat-window {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
    }
    .chat-window-header {
      padding: 16px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .back-btn {
      display: none;
      background: #000;
      color: #C8FF00;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .chat-window-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #f0f0f0;
    }
    .bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .bubble.customer {
      background: #fff;
      border: 1px solid #ddd;
      margin-right: auto;
    }
    .bubble.admin {
      background: #C8FF00;
      color: #000;
      margin-left: auto;
    }
    .chat-window-input {
      display: flex;
      padding: 12px;
      background: #fff;
      border-top: 1px solid #ddd;
      flex-shrink: 0;
    }
    .chat-window-input input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      min-width: 0;
    }
    .chat-window-input button {
      margin-left: 8px;
      padding: 12px 18px;
      background: #C8FF00;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      padding: 20px;
      text-align: center;
    }

    @media (max-width: 700px) {
      .chat-list {
        max-width: 100%;
      }
      .chat-list.hide-on-mobile {
        display: none;
      }
      .chat-window.hide-on-mobile {
        display: none;
      }
      .back-btn {
        display: inline-block;
      }
    }
  </style>
</head>
<body>

<div id="loginScreen" style="position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:1000; flex-direction:column; padding:20px;">
  <h2 style="color:#C8FF00; margin-bottom:20px;">NEXORA Admin</h2>
  <input type="password" id="passInput" placeholder="Enter password" style="padding:14px; border-radius:10px; border:none; width:80%; max-width:300px; font-size:16px; margin-bottom:12px;">
  <button id="unlockBtn" style="padding:14px 30px; background:#C8FF00; border:none; border-radius:10px; font-weight:700; cursor:pointer;">Unlock</button>
  <p id="wrongPass" style="color:#ff5555; display:none; margin-top:10px;">Wrong password, try again.</p>
</div>

<div id="adminApp" style="display:none; width:100%; height:100%;">

  <div class="chat-list" id="chatList">
    <h2>N.X CUSTOMER — REQUEST <span class="logo-badge">NX</span></h2>
  </div>

  <div class="chat-window hide-on-mobile" id="chatWindow">
    <div class="empty-state">Select a request to view chat</div>
  </div>

</div>

<!-- IMPORTANT: app must load first, then auth, then database -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
  const chatListEl = document.getElementById("chatList");
  const chatWindowEl = document.getElementById("chatWindow");
  const loginScreen = document.getElementById("loginScreen");
  const adminApp = document.getElementById("adminApp");
  const passInput = document.getElementById("passInput");
  const unlockBtn = document.getElementById("unlockBtn");
  const wrongPass = document.getElementById("wrongPass");

  let activeChatId = null;
  let activeMessagesRef = null;
  let allChats = {};

  function isMobile() {
    return window.innerWidth <= 700;
  }

  // ============ Auth Gate ============
  const ADMIN_EMAIL = "boytushexchange@gmail.com";

  firebase.auth().onAuthStateChanged((user) => {
  if (user && user.email === ADMIN_EMAIL) {
    loginScreen.style.display = "none";
    adminApp.style.display = "flex";
    startListeningToChats();
  } else {
    loginScreen.style.display = "flex";
    adminApp.style.display = "none";
    if (user) {
      firebase.auth().signOut();
    }
  }
});

  function tryUnlock() {
    const password = passInput.value;
    firebase.auth().signInWithEmailAndPassword(ADMIN_EMAIL, password)
      .then(() => {
        wrongPass.style.display = "none";
      })
      .catch((error) => {
        wrongPass.style.display = "block";
      });
  }

  unlockBtn.addEventListener("click", tryUnlock);
  passInput.addEventListener("keypress", (e) => { if (e.key === "Enter") tryUnlock(); });

  // ============ Chat List (only starts after login confirmed) ============
  function startListeningToChats() {
    db.ref("chats").on("value", (snapshot) => {
      allChats = snapshot.val() || {};
      renderChatList();
    }, (error) => {
      alert("READ ERROR: " + error.message);
    });
  }

  function renderChatList() {
    chatListEl.querySelectorAll(".chat-item").forEach(el => el.remove());

    const entries = Object.entries(allChats).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

    if (entries.length === 0) {
      const empty = document.createElement("div");
      empty.className = "chat-item";
      empty.style.color = "#777";
      empty.style.cursor = "default";
      empty.textContent = "No requests yet.";
      chatListEl.appendChild(empty);
      return;
    }

    entries.forEach(([chatId, chat]) => {
      const item = document.createElement("div");
      item.className = "chat-item" + (chatId === activeChatId ? " active" : "");
      item.style.display = "flex";
      item.style.justifyContent = "space-between";
      item.style.alignItems = "center";

      const checkmark = chat.status === "completed" ? "\u2714\uFE0F " : "";
      item.innerHTML = `
        <div class="chat-item-content" style="flex:1; cursor:pointer;">
          <div class="title">${checkmark}${chat.method || "Unknown"} — ${chat.total || ""}</div>
          <div class="sub">${chat.currency || ""} • Amount: ${chat.amount || "-"} • ${chat.status || ""}</div>
        </div>
        <button class="delete-chat-btn" style="background:none; border:none; color:#ff5555; font-size:18px; padding:8px; cursor:pointer;">\uD83D\uDDD1</button>
      `;
      item.querySelector(".chat-item-content").addEventListener("click", () => openChat(chatId, chat));
      item.querySelector(".delete-chat-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        db.ref("chats/" + chatId).remove();
      });
      chatListEl.appendChild(item);
    });
  }

  function openChat(chatId, chatData) {
    activeChatId = chatId;
    renderChatList();

    if (isMobile()) {
      chatListEl.classList.add("hide-on-mobile");
      chatWindowEl.classList.remove("hide-on-mobile");
    }

    chatWindowEl.innerHTML = `
      <div class="chat-window-header">
        <button class="back-btn" id="backBtn">← Back</button>
        <span>${chatData.method || ""} — ${chatData.total || ""} (${chatData.currency || ""}, Amount: ${chatData.amount || "-"})</span>
        <button id="markDoneBtn" style="margin-left:auto; background:#C8FF00; border:none; padding:6px 10px; border-radius:6px; font-weight:700; cursor:pointer;">✔ Mark Done</button>
      </div>
      <div class="chat-window-messages" id="chatWindowMessages"></div>
      <div class="chat-window-input">
        <input type="text" id="adminMessageInput" placeholder="Type your reply...">
        <button id="adminSendBtn">Send</button>
      </div>
    `;

    document.getElementById("backBtn").addEventListener("click", () => {
      chatListEl.classList.remove("hide-on-mobile");
      chatWindowEl.classList.add("hide-on-mobile");
    });

    document.getElementById("markDoneBtn").addEventListener("click", () => {
      db.ref("chats/" + chatId).update({ status: "completed" });
    });

    const messagesEl = document.getElementById("chatWindowMessages");
    const input = document.getElementById("adminMessageInput");
    const sendBtn = document.getElementById("adminSendBtn");

    if (activeMessagesRef) activeMessagesRef.off();
    activeMessagesRef = db.ref("chats/" + chatId + "/messages");

    messagesEl.innerHTML = "";
    activeMessagesRef.on("child_added", (snap) => {
      const msg = snap.val();
      const bubble = document.createElement("div");
      bubble.className = "bubble " + (msg.sender === "admin" ? "admin" : "customer");
      bubble.textContent = msg.text;
      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    function send() {
      const text = input.value.trim();
      if (!text) return;
      activeMessagesRef.push({ sender: "admin", text: text, time: Date.now() });
      input.value = "";
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("keypress", (e) => { if (e.key === "Enter") send(); });
  }

  function fixHeights() {
    const h = window.innerHeight + "px";
    document.body.style.height = h;
    chatListEl.style.height = h;
  }
  fixHeights();
  window.addEventListener("resize", fixHeights);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fixHeights);
  }
</script>
</body>
</html>
